<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F2">
<title>혜진의 하루</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    color-scheme: light;
    --bg: #FFF8F2; --card: #fff; --text: #2B1D14; --sub: #7A6656; --line: #F5DCC6;
    --orange: #F26B1D; --orange-dark: #D9560B; --orange-soft: #FFEBDC; --orange-pale: #FFF3EA; --red: #D93025;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 560px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px 48px; }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; }
  [hidden] { display: none !important; }
  h1, h2 { font-weight: 800; margin: 0; }
  .sub { font-size: 19px; color: var(--sub); margin: 0; }

  /* 위쪽: 달 탭 + 날짜 이동 */
  .month-tab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 19px; font-weight: 700; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0 4px; }
  .nav h1 { font-size: 28px; text-align: center; flex: 1; }
  .arrow { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--orange-soft); color: var(--orange-dark); font-size: 24px; font-weight: 800; }
  .go-today { display: block; margin: 0 auto 8px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--orange); color: var(--orange-dark); font-size: 17px; font-weight: 700; }

  .cheer { margin: 12px 0; padding: 18px; border-radius: 18px; background: linear-gradient(135deg, #FF9A4D, var(--orange)); color: #fff; font-size: 21px; font-weight: 600; line-height: 1.45; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
  input { width: 100%; font: inherit; font-size: 22px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; color: var(--text); background: #fff; }
  input:focus { outline: none; border-color: var(--orange); }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add button { flex: 1; padding: 16px 0; border-radius: 12px; font-size: 20px; font-weight: 700; }
  .add .routine { background: var(--orange); color: #fff; }
  .add .todo { background: var(--orange-soft); color: var(--orange-dark); }

  h2 { font-size: 23px; margin: 28px 0 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  .empty { font-size: 19px; color: var(--sub); padding: 8px 0; }
  .item { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; padding-right: 6px; }
  .item.done { background: var(--orange-pale); }
  .main { flex: 1; display: flex; align-items: center; gap: 14px; padding: 14px; text-align: left; }
  .main:disabled { cursor: default; }
  .check { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 3px solid var(--orange); display: grid; place-items: center; color: #fff; font-size: 22px; font-weight: 800; }
  .main:disabled .check { border-style: dashed; border-color: var(--line); }
  .done .check { background: var(--orange); border-color: var(--orange); }
  .title { display: block; font-size: 22px; font-weight: 500; word-break: keep-all; overflow-wrap: anywhere; }
  .done .title { color: #B09A88; text-decoration: line-through; }
  .late { display: block; font-size: 17px; color: var(--red); margin-top: 2px; }
  .postpone { flex: none; padding: 10px 12px; border-radius: 10px; background: var(--orange-soft); color: var(--orange-dark); font-size: 17px; font-weight: 700; }
  .del { flex: none; width: 48px; height: 48px; color: #B09A88; font-size: 22px; }
  .later { font-size: 18px; color: var(--sub); margin: 6px 0 0; }

  /* 달력 */
  .week, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .week { margin: 16px 0 6px; font-size: 16px; font-weight: 700; color: var(--sub); }
  .week :first-child, .grid .sun { color: var(--red); }
  .grid button { aspect-ratio: 1 / 1.1; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 19px; font-weight: 600; }
  .grid .past { color: #B09A88; }
  .grid .today { background: var(--orange); border-color: var(--orange); color: #fff; }
  .grid .selected { outline: 3px solid var(--orange-dark); outline-offset: 1px; }
  .badge { min-width: 22px; padding: 1px 6px; border-radius: 999px; background: var(--orange-soft); color: var(--orange-dark); font-size: 13px; font-weight: 700; }
  .today .badge { background: #fff; }
  .badge:empty { visibility: hidden; }
  .hint { text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <button id="month-tab" class="month-tab" aria-label="달력 보기"></button>

  <!-- 하루 화면 -->
  <section id="day-view">
    <div class="nav">
      <button class="arrow" id="prev-day" aria-label="전날">◀</button>
      <h1 id="date"></h1>
      <button class="arrow" id="next-day" aria-label="다음날">▶</button>
    </div>
    <button id="go-today" class="go-today">오늘로 돌아가기</button>

    <p id="cheer" class="cheer"></p>
    <p id="progress" class="sub"></p>

    <div id="add-card" class="card">
      <input id="text" placeholder="무엇을 할까요?" autocomplete="off" aria-label="추가할 내용">
      <div class="add">
        <button type="button" class="routine" data-type="routine">+ 매일 루틴</button>
        <button type="button" class="todo" data-type="todo" id="add-todo">+ 할 일</button>
      </div>
    </div>

    <h2>🌅 매일 루틴</h2>
    <ul id="routines"></ul>
    <h2 id="todo-heading"></h2>
    <ul id="todos"></ul>
    <p id="later" class="later"></p>
  </section>

  <!-- 달력 화면 -->
  <section id="cal-view" hidden>
    <div class="nav">
      <button class="arrow" id="prev-month" aria-label="전달">◀</button>
      <h1 id="cal-title"></h1>
      <button class="arrow" id="next-month" aria-label="다음달">▶</button>
    </div>
    <div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div id="grid" class="grid"></div>
    <p class="sub hint">날짜를 누르면 그 날의 할 일을 보고 추가할 수 있어요</p>
  </section>
</main>

<script type="module">
import { ymd, toDate, addDays, daysBetween, isDone, dayRoutines, dayTodos, sortItems, migrate } from './logic.js';
import { MESSAGES } from './messages.js';

// 데이터는 이 폰의 브라우저에만 저장된다.
// ponytail: 지난 기록을 지우지 않음 — 하루 몇 개씩이면 수십 년 써도 저장 한도(5MB)에 안 닿음.
const KEY = 'items';
const $ = (s) => document.querySelector(s);
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];

let items = [];
try { items = migrate(JSON.parse(localStorage.getItem(KEY)) ?? []); } catch {}
let today = ymd(new Date());
let view = today;          // 하루 화면에서 보고 있는 날짜
let calMonth = null;       // 달력 화면이면 그 달의 1일, 아니면 null

// 처음 한 번만 기본 루틴을 넣는다 (지워도 다시 생기지 않게)
let seeded = false;
try { seeded = !!localStorage.getItem('seeded'); } catch {}
if (!seeded) {
  items.unshift(
    { id: 1, type: 'routine', title: '듀오링고', date: today, doneDates: [] },
    { id: 2, type: 'routine', title: '8000보 이상 걷기', date: today, doneDates: [] }
  );
  try { localStorage.setItem(KEY, JSON.stringify(items)); localStorage.setItem('seeded', '1'); } catch {}
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); }
  catch { alert('저장하지 못했어요. 인터넷 브라우저의 "비밀 모드"가 아닌지 확인해 주세요.'); }
  render();
}

const update = (id, fn) => { items = items.map((i) => (i.id === id ? fn(i) : i)); save(); };

function toggle(item) {
  update(item.id, (i) =>
    i.type === 'routine'
      ? { ...i, doneDates: isDone(i, view) ? i.doneDates.filter((d) => d !== view) : [...i.doneDates, view] }
      : { ...i, doneOn: i.doneOn ? null : view }
  );
}

function add(type) {
  const title = $('#text').value.trim();
  if (!title) { alert('내용을 먼저 적어주세요'); return $('#text').focus(); }
  items.push(type === 'routine'
    ? { id: Date.now(), type, title, date: view, doneDates: [] }
    : { id: Date.now(), type, title, date: view, doneOn: null });
  $('#text').value = '';
  save();
}

function remove(item) {
  if (!confirm(`"${item.title}"\n삭제할까요?`)) return;
  items = items.filter((i) => i.id !== item.id);
  save();
}

const fmtDate = (s) => { const d = toDate(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`; };
const cheerFor = (day) => MESSAGES[((daysBetween('2026-01-01', day) % MESSAGES.length) + MESSAGES.length) % MESSAGES.length];

const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    k.startsWith('on') ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v === true ? '' : v);
  }
  e.append(...kids.filter((k) => k != null && k !== false));
  return e;
};

function row(item) {
  const done = isDone(item, view);
  const future = view > today; // 미래 날짜는 계획만: 체크는 그 날이 되면
  const late = item.type === 'todo' && !done && view === today && item.date < today ? daysBetween(item.date, today) : 0;
  return el('li', { class: done ? 'item done' : 'item' },
    el('button', { class: 'main', role: 'checkbox', 'aria-checked': String(done), disabled: future, onclick: () => toggle(item) },
      el('span', { class: 'check' }, done ? '✓' : ''),
      el('span', {},
        el('span', { class: 'title' }, item.title),
        late > 0 && el('span', { class: 'late' }, late === 1 ? '어제부터' : `${late}일 전부터`))),
    item.type === 'todo' && !done && view === today &&
      el('button', { class: 'postpone', onclick: () => update(item.id, (i) => ({ ...i, date: addDays(today, 1) })) }, '내일로'),
    el('button', { class: 'del', 'aria-label': `${item.title} 삭제`, onclick: () => remove(item) }, '✕'));
}

const fill = (ul, list, emptyMsg) =>
  ul.replaceChildren(...(list.length ? list.map(row) : [el('li', { class: 'empty' }, emptyMsg)]));

function renderDay() {
  const routines = sortItems(dayRoutines(items, view), view);
  const todos = sortItems(dayTodos(items, view, today), view);
  const all = [...routines, ...todos];
  const doneCount = all.filter((i) => isDone(i, view)).length;
  const isToday = view === today;

  $('#date').textContent = fmtDate(view);
  $('#go-today').hidden = isToday;
  $('#cheer').textContent = cheerFor(view);
  $('#progress').textContent =
    view > today ? `할 일 ${todos.length}개를 미리 적어뒀어요`
    : all.length ? `${isToday ? '오늘 ' : ''}${all.length}개 중 ${doneCount}개 했어요`
    : '';
  $('#add-card').hidden = view < today; // 지난 날에는 추가하지 않음
  $('#add-todo').textContent = isToday ? '+ 오늘 할 일' : '+ 이 날 할 일';
  $('#todo-heading').textContent = isToday ? '📝 오늘 할 일' : '📝 할 일';
  fill($('#routines'), routines, '매일 하는 일을 추가해 보세요');
  fill($('#todos'), todos, isToday ? '오늘 할 일이 없어요' : '할 일이 없어요');
  const later = isToday ? items.filter((i) => i.type === 'todo' && !i.doneOn && i.date === addDays(today, 1)).length : 0;
  $('#later').textContent = later ? `내일 할 일 ${later}개 (▶ 눌러서 보기)` : '';
}

function renderCal() {
  const first = toDate(calMonth);
  $('#cal-title').textContent = `${first.getFullYear()}년 ${first.getMonth() + 1}월`;
  const blanks = Array.from({ length: first.getDay() }, () => el('span'));
  const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const days = Array.from({ length: daysInMonth }, (_, n) => {
    const day = addDays(calMonth, n);
    const count = dayTodos(items, day, today).length;
    const cls = [day === today ? 'today' : day < today ? 'past' : '', day === view && 'selected', toDate(day).getDay() === 0 && 'sun'].filter(Boolean).join(' ');
    return el('button', { class: cls, 'aria-label': `${fmtDate(day)} 할 일 ${count}개`, onclick: () => { view = day; calMonth = null; render(); } },
      String(n + 1), el('span', { class: 'badge' }, count ? String(count) : ''));
  });
  $('#grid').replaceChildren(...blanks, ...days);
}

function render() {
  today = ymd(new Date());
  const onCal = calMonth !== null;
  $('#day-view').hidden = onCal;
  $('#cal-view').hidden = !onCal;
  $('#month-tab').textContent = onCal ? '← 돌아가기' : `📅 ${toDate(view).getMonth() + 1}월`;
  onCal ? renderCal() : renderDay();
}

const monthStart = (day) => day.slice(0, 8) + '01';
const shiftMonth = (m, n) => { const d = toDate(m); d.setMonth(d.getMonth() + n); return ymd(d); };

$('#month-tab').addEventListener('click', () => { calMonth = calMonth ? null : monthStart(view); render(); });
$('#prev-day').addEventListener('click', () => { view = addDays(view, -1); render(); });
$('#next-day').addEventListener('click', () => { view = addDays(view, 1); render(); });
$('#go-today').addEventListener('click', () => { view = today; render(); });
$('#prev-month').addEventListener('click', () => { calMonth = shiftMonth(calMonth, -1); render(); });
$('#next-month').addEventListener('click', () => { calMonth = shiftMonth(calMonth, 1); render(); });
document.querySelectorAll('.add button').forEach((b) => b.addEventListener('click', () => add(b.dataset.type)));

// 홈 화면 앱은 계속 켜져 있을 수 있으니, 다시 볼 때 날짜가 바뀌었으면 오늘로 돌아간다
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const was = today;
  today = ymd(new Date());
  if (view === was) view = today;
  render();
});
render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
