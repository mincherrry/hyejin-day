<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<title>혜진의 하루</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { color-scheme: light; --bg: #FFF8F0; --card: #fff; --text: #222; --sub: #666; --orange: #E8743B; --blue: #4A7FD6; --green: #3BA55C; --line: #EADFD3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 48px; }
  h1 { font-size: 30px; margin: 8px 0 4px; }
  h2 { font-size: 24px; margin: 28px 0 10px; }
  .sub { font-size: 20px; color: var(--sub); margin: 0 0 16px; }
  button { font: inherit; border: 0; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  input { width: 100%; font: inherit; font-size: 22px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; color: var(--text); background: #fff; }
  input:focus { outline: none; border-color: var(--orange); }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add button { flex: 1; padding: 16px 0; border-radius: 12px; font-size: 20px; font-weight: bold; color: #fff; }
  .add .routine { background: var(--orange); }
  .add .todo { background: var(--blue); }
  ul { list-style: none; margin: 0; padding: 0; }
  .empty { font-size: 19px; color: var(--sub); padding: 8px 0; }
  .item { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; padding-right: 6px; }
  .item.done { background: #F4F1ED; }
  .main { flex: 1; display: flex; align-items: center; gap: 14px; padding: 14px; background: none; text-align: left; color: inherit; }
  .check { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 3px solid var(--orange); display: grid; place-items: center; color: #fff; font-size: 22px; font-weight: bold; }
  .done .check { background: var(--green); border-color: var(--green); }
  .title { display: block; font-size: 22px; word-break: keep-all; overflow-wrap: anywhere; }
  .done .title { color: #999; text-decoration: line-through; }
  .late { display: block; font-size: 17px; color: #C0392B; margin-top: 2px; }
  .postpone { flex: none; padding: 10px 12px; border-radius: 10px; background: #E9F0FB; color: #2F5DA8; font-size: 17px; font-weight: bold; }
  .del { flex: none; width: 48px; height: 48px; background: none; color: #999; font-size: 22px; }
  .later { font-size: 18px; color: var(--sub); margin: 6px 0 0; }
</style>
</head>
<body>
<main>
  <h1 id="date"></h1>
  <p id="progress" class="sub"></p>

  <div class="card">
    <input id="text" placeholder="무엇을 할까요?" autocomplete="off" aria-label="추가할 내용">
    <div class="add">
      <button type="button" class="routine" data-type="routine">+ 매일 루틴</button>
      <button type="button" class="todo" data-type="todo">+ 오늘 할 일</button>
    </div>
  </div>

  <h2>🌅 매일 루틴</h2>
  <ul id="routines"></ul>
  <h2>📝 오늘 할 일</h2>
  <ul id="todos"></ul>
  <p id="later" class="later"></p>
</main>

<script type="module">
import { ymd, addDays, daysBetween, prune, todayTodos, sortItems } from './logic.js';

// 항목: { id, type: 'routine'|'todo', title, time: null, date: 'YYYY-MM-DD'(할 일 날짜), doneOn: 'YYYY-MM-DD'|null }
// 데이터는 이 폰의 브라우저에만 저장된다.
const KEY = 'items';
const $ = (s) => document.querySelector(s);
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY)) ?? []; } catch {}
let today;

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); }
  catch { alert('저장하지 못했어요. 인터넷 브라우저의 "비밀 모드"가 아닌지 확인해 주세요.'); }
  render();
}

const update = (id, patch) => { items = items.map((i) => (i.id === id ? { ...i, ...patch } : i)); save(); };

function add(type) {
  const title = $('#text').value.trim();
  if (!title) { alert('내용을 먼저 적어주세요'); return $('#text').focus(); }
  items.push({ id: Date.now(), type, title, time: null, date: today, doneOn: null });
  $('#text').value = '';
  save();
}

function remove(item) {
  if (!confirm(`"${item.title}"\n삭제할까요?`)) return;
  items = items.filter((i) => i.id !== item.id);
  save();
}

const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDate = (s) => {
  const [y, m, d] = s.split('-').map(Number);
  return `${m}월 ${d}일 (${WEEK[new Date(y, m - 1, d).getDay()]})`;
};

const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k.startsWith('on') ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  e.append(...kids.filter((k) => k != null && k !== false));
  return e;
};

function row(item) {
  const done = item.doneOn === today;
  const late = item.type === 'todo' && !done && item.date < today ? daysBetween(item.date, today) : 0;
  return el('li', { class: done ? 'item done' : 'item' },
    el('button', { class: 'main', role: 'checkbox', 'aria-checked': String(done), onclick: () => update(item.id, { doneOn: done ? null : today }) },
      el('span', { class: 'check' }, done ? '✓' : ''),
      el('span', {},
        el('span', { class: 'title' }, item.title),
        late > 0 && el('span', { class: 'late' }, late === 1 ? '어제부터' : `${late}일 전부터`))),
    item.type === 'todo' && !done && el('button', { class: 'postpone', onclick: () => update(item.id, { date: addDays(today, 1) }) }, '내일로'),
    el('button', { class: 'del', 'aria-label': `${item.title} 삭제`, onclick: () => remove(item) }, '✕'));
}

const fill = (ul, list, emptyMsg) =>
  ul.replaceChildren(...(list.length ? list.map(row) : [el('li', { class: 'empty' }, emptyMsg)]));

function render() {
  today = ymd(new Date());
  items = prune(items, today);
  const routines = sortItems(items.filter((i) => i.type === 'routine'), today);
  const todos = sortItems(todayTodos(items, today), today);
  const all = [...routines, ...todos];
  const doneCount = all.filter((i) => i.doneOn === today).length;
  const later = items.filter((i) => i.type === 'todo' && !i.doneOn && i.date > today).length;

  $('#date').textContent = fmtDate(today);
  $('#progress').textContent = all.length ? `오늘 ${all.length}개 중 ${doneCount}개 했어요` : '오늘 할 일을 추가해 보세요';
  fill($('#routines'), routines, '매일 하는 일을 추가해 보세요');
  fill($('#todos'), todos, '오늘 할 일이 없어요');
  $('#later').textContent = later ? `내일로 미룬 일 ${later}개` : '';
}

document.querySelectorAll('.add button').forEach((b) => b.addEventListener('click', () => add(b.dataset.type)));
// 홈 화면 앱은 계속 켜져 있을 수 있으니, 다시 볼 때마다 날짜를 새로 확인
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && render());
render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
